name: Publish browser game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: browser-game
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:pages
      # GITHUB_TOKEN pushes do not themselves trigger a branch-based Pages build.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
