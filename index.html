<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Generals No Limits</title>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="world-labels"></div>
    <div id="float-labels"></div>
    <div id="selection-box"></div>
    <header id="hud" hidden>
      <div>
        <small>SKIRMISH COMMAND</small>
        <h1>GENERALS <span>NO LIMITS</span></h1>
      </div>
      <div id="resources"></div>
      <button id="pause-button">Ⅱ Menu</button>
    </header>
    <section id="command-deck" data-tab="orders" data-collapsed="false" hidden>
      <div class="deck-top">
        <div class="deck-tabs">
          <button id="orders-tab" class="active">BEVELEN</button
          ><button id="powers-tab">
            GENERALS <b id="general-points">1</b>
          </button>
        </div>
        <div class="deck-status"><i></i> COMMAND LINK ONLINE</div>
        <button
          id="deck-toggle"
          aria-expanded="true"
          aria-controls="deck-content"
        >
          COMMANDOBALK INKLAPPEN ▾
        </button>
      </div>
      <div id="deck-content">
        <div id="mapbox" hidden>
          <small>TACTICAL RADAR</small>
          <div class="radar-frame">
            <canvas id="minimap" width="200" height="200"></canvas>
          </div>
          <span class="radar-coords">SATELLITE UPLINK · LIVE</span>
        </div>
        <div class="deck-intel">
          <div class="portrait-frame">
            <img id="selected-portrait" alt="Geselecteerde eenheid" /><span
              id="portrait-caption"
              >COMMAND</span
            >
          </div>
          <div id="production" hidden></div>
          <div id="objectives"></div>
        </div>
        <aside id="command" hidden>
          <div class="command-title">
            <h2 id="selection">Command Center</h2>
            <p id="description"></p>
          </div>
          <div id="actions"></div>
          <div id="queue"></div>
        </aside>
        <section id="powers-panel" hidden>
          <div class="command-title">
            <h2>General's Powers</h2>
            <div id="rank"></div>
          </div>
          <div id="powers"></div>
        </section>
      </div>
    </section>
    <div id="super-timers"></div>
    <footer id="help">
      WASD / schermrand: camera · Scroll: zoom · Scrollknop slepen: draaien ·
      Sleep: groep · Ctrl + rechts: Force Fire · Ctrl+1–9: groepen · Esc: menu
    </footer>
    <div id="toast" role="status"></div>
    <div id="overlay"></div>
    <input id="load-file" type="file" accept=".json" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
